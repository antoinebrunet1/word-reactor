name: Build

on: push

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    container: antoinebrunet1/word_reactor_pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Style
        run: make check_style

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    container: antoinebrunet1/word_reactor_pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Documentation
        run: make check_docs

  unit-tests-cov:
    name: Unit tests coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Coverage is at least 80%
        run: |
          python3 -m pip install pytest-cov discord.py pytest pytest-mock python-dotenv pytest-asyncio flask
          python3 -m pytest --cov=main --cov-fail-under=80 --cov-report json

      - name: Update Coverage Badge
        # GitHub actions: default branch variable
        # https://stackoverflow.com/questions/64781462/github-actions-default-branch-variable
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@main

  generate_docs:
    name: Generate docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Generate docs
        run: |
          python3 -m pip install discord.py python-dotenv pdoc flask
          make generate_docs

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy_docs:
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate_docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4